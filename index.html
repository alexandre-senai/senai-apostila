<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Início</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      font-family: 'Space Grotesk', sans-serif;
      gap: 1.5rem;
      padding: 2rem;
      flex-wrap: wrap;
    }

    a.card {
      text-decoration: none;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 14px;
      width: 220px;
      height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      color: #e6edf3;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      padding: 1.5rem;
      transition: border-color 0.2s, transform 0.2s, background 0.2s;
      cursor: pointer;
    }

    a.card:hover {
      background: #1c2330;
      border-color: #2f81f7;
      transform: translateY(-4px);
    }

    .card-icon {
      font-size: 2rem;
    }
  </style>
</head>
<body>

  <a href="banco_dados.html" class="card">
    <span class="card-icon">🗄️</span>
    Banco de Dados
  </a>

  <a href="programacao_aplicativo.html" class="card">
    <span class="card-icon">💻</span>
    Programação de Aplicativo
  </a>

</body>
</html>
